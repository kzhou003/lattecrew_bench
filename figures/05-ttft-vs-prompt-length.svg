<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" class="chart" viewBox="0 0 720 300" role="img" aria-label="TTFT vs prompt length" preserveAspectRatio="xMidYMid meet"><style>svg{
  /* Layout: one reading column of about 68ch; figures may widen to 920px. Lab-notebook calm, coffee-tinted neutrals. */
  --bg:#f7f6f3; --panel:#ffffff; --fg:#1d1c1a; --muted:#5d5b55; --faint:#8b8880; --rule:#e2dfd8; --grid:#ebe8e2;
  --accent:#7a4a2a; --code-bg:#efece6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --mute-fill:#c9c6bf;
  --n0:#f1efea; --n1:#e9f1fb; --n2:#eef7f2; --n3:#fbf0e9; --n4:#f5f1e3;
  --display:"Noto Serif SC","Songti SC",serif; --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
 font-family:'Noto Sans SC','PingFang SC',sans-serif; background:var(--panel)}
svg.chart{display:block;width:100%;height:auto;min-width:560px}
svg .s1{fill:var(--s1)} svg .s2{fill:var(--s2)} svg .s3{fill:var(--s3)} svg .s4{fill:var(--s4)} svg .muted{fill:var(--mute-fill)}
svg .seg-ok{fill:var(--s1)} svg .seg-bad{fill:var(--s2)} svg .seg-miss{fill:var(--mute-fill)}
svg .line{fill:none;stroke-width:2} svg .line.s1{stroke:var(--s1)} svg .line.s2{stroke:var(--s2)} svg .line.s4{stroke:var(--s4)}
svg .dot{stroke:var(--panel);stroke-width:2}
svg .grid{stroke:var(--grid);stroke-width:1} svg .axis{stroke:var(--faint);stroke-width:1} svg .rowrule{stroke:var(--grid);stroke-dasharray:2 4}
svg text{fill:var(--muted);font-family:var(--body);font-size:12.5px}
svg .tick{font-family:var(--mono);font-size:11px;fill:var(--faint)}
svg .val{font-family:var(--mono);font-size:12px;fill:var(--fg)}
svg .lab{fill:var(--fg);font-size:13px} svg .axlab{font-size:12px;fill:var(--muted)}
svg .hitbox{fill:transparent} svg .hair{stroke:var(--faint);stroke-width:1;opacity:0}
svg .col:hover .hair,svg .col:focus .hair{opacity:1}
svg .hit:hover path,svg .hit:hover > rect:not(.hitbox){opacity:.85}
svg .node{fill:var(--n0);stroke:var(--rule)} svg .node.n1{fill:var(--n1)} svg .node.n2{fill:var(--n2)} svg .node.n3{fill:var(--n3)} svg .node.n4{fill:var(--n4)}
svg .nodet{fill:var(--fg);font-weight:600;font-size:14px} svg .nodes{fill:var(--muted);font-size:12px}
svg .meas{fill:var(--fg);font-family:var(--mono);font-size:12.5px}
svg .flow{stroke:var(--faint);stroke-width:1.5} svg .arrowhead{fill:var(--faint)}
svg .life{stroke:var(--rule);stroke-dasharray:3 4}
svg .msg{fill:none;stroke-width:1.8} svg .msg.m1{stroke:var(--s1)} svg .msg.m2{stroke:var(--s2)} svg .msg.m3{stroke:var(--s3)}
svg .msgt{fill:var(--fg);font-size:12.5px;font-weight:600} svg .msgs{fill:var(--muted);font-size:11.5px}
svg .hair{display:none}</style><line class="grid" x1="58" x2="600" y1="256.0" y2="256.0"/><text class="tick" x="50" y="256.0" text-anchor="end" dominant-baseline="middle">0</text><line class="grid" x1="58" x2="600" y1="204.2" y2="204.2"/><text class="tick" x="50" y="204.2" text-anchor="end" dominant-baseline="middle">5</text><line class="grid" x1="58" x2="600" y1="152.4" y2="152.4"/><text class="tick" x="50" y="152.4" text-anchor="end" dominant-baseline="middle">10</text><line class="grid" x1="58" x2="600" y1="100.7" y2="100.7"/><text class="tick" x="50" y="100.7" text-anchor="end" dominant-baseline="middle">15</text><line class="grid" x1="58" x2="600" y1="48.9" y2="48.9"/><text class="tick" x="50" y="48.9" text-anchor="end" dominant-baseline="middle">20</text><text class="tick" x="58.0" y="274" text-anchor="middle">0K</text><text class="tick" x="217.4" y="274" text-anchor="middle">20K</text><text class="tick" x="376.7" y="274" text-anchor="middle">40K</text><text class="tick" x="536.1" y="274" text-anchor="middle">60K</text><line class="axis" x1="58" x2="600" y1="256" y2="256"/><text class="axlab" x="329.0" y="294" text-anchor="middle">提示长度（token）</text><text class="axlab" x="14" y="136.0" text-anchor="middle" transform="rotate(-90 14 136.0)">首 token 延迟（秒）</text><path class="line s1" d="M62.0,254.5 L74.1,250.7 L124.6,233.9 L192.6,210.0 L328.8,156.8 L471.4,93.9 L579.2,41.7"/><circle class="dot s1" cx="62.0" cy="254.5" r="4.5"/><circle class="dot s1" cx="74.1" cy="250.7" r="4.5"/><circle class="dot s1" cx="124.6" cy="233.9" r="4.5"/><circle class="dot s1" cx="192.6" cy="210.0" r="4.5"/><circle class="dot s1" cx="328.8" cy="156.8" r="4.5"/><circle class="dot s1" cx="471.4" cy="93.9" r="4.5"/><circle class="dot s1" cx="579.2" cy="41.7" r="4.5"/><text class="lab" x="589.2" y="41.7" dominant-baseline="middle">冷启动</text><path class="line s2" d="M62.0,254.5 L74.1,254.5 L124.6,254.0 L192.6,254.1 L328.8,253.9 L471.4,253.7 L579.2,252.9"/><circle class="dot s2" cx="62.0" cy="254.5" r="4.5"/><circle class="dot s2" cx="74.1" cy="254.5" r="4.5"/><circle class="dot s2" cx="124.6" cy="254.0" r="4.5"/><circle class="dot s2" cx="192.6" cy="254.1" r="4.5"/><circle class="dot s2" cx="328.8" cy="253.9" r="4.5"/><circle class="dot s2" cx="471.4" cy="253.7" r="4.5"/><circle class="dot s2" cx="579.2" cy="252.9" r="4.5"/><text class="lab" x="589.2" y="252.9" dominant-baseline="middle">命中缓存</text><g class="hit col" data-tip="冷启动: 506 token，0.15 秒 | 命中缓存: 149 ms"><rect class="hitbox" x="58.0" y="16" width="10.1" height="240"/><line class="hair" x1="62.0" x2="62.0" y1="16" y2="256"/></g><g class="hit col" data-tip="冷启动: 2,018 token，0.52 秒 | 命中缓存: 142 ms"><rect class="hitbox" x="68.1" y="16" width="31.3" height="240"/><line class="hair" x1="74.1" x2="74.1" y1="16" y2="256"/></g><g class="hit col" data-tip="冷启动: 8,359 token，2.14 秒 | 命中缓存: 190 ms"><rect class="hitbox" x="99.3" y="16" width="59.3" height="240"/><line class="hair" x1="124.6" x2="124.6" y1="16" y2="256"/></g><g class="hit col" data-tip="冷启动: 16,893 token，4.44 秒 | 命中缓存: 181 ms"><rect class="hitbox" x="158.6" y="16" width="102.1" height="240"/><line class="hair" x1="192.6" x2="192.6" y1="16" y2="256"/></g><g class="hit col" data-tip="冷启动: 33,989 token，9.58 秒 | 命中缓存: 206 ms"><rect class="hitbox" x="260.7" y="16" width="139.4" height="240"/><line class="hair" x1="328.8" x2="328.8" y1="16" y2="256"/></g><g class="hit col" data-tip="冷启动: 51,879 token，15.65 秒 | 命中缓存: 218 ms"><rect class="hitbox" x="400.1" y="16" width="125.2" height="240"/><line class="hair" x1="471.4" x2="471.4" y1="16" y2="256"/></g><g class="hit col" data-tip="冷启动: 65,401 token，20.69 秒 | 命中缓存: 298 ms"><rect class="hitbox" x="525.3" y="16" width="74.7" height="240"/><line class="hair" x1="579.2" x2="579.2" y1="16" y2="256"/></g></svg>