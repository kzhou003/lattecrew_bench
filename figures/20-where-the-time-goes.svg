<svg xmlns="http://www.w3.org/2000/svg" width="720" height="214" class="chart" viewBox="0 0 720 214" role="img" aria-label="Where the time goes" preserveAspectRatio="xMidYMid meet"><style>svg{
  /* Layout: one reading column of about 68ch; figures may widen to 920px. Lab-notebook calm, coffee-tinted neutrals. */
  --bg:#f7f6f3; --panel:#ffffff; --fg:#1d1c1a; --muted:#5d5b55; --faint:#8b8880; --rule:#e2dfd8; --grid:#ebe8e2;
  --accent:#7a4a2a; --code-bg:#efece6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --mute-fill:#c9c6bf;
  --n0:#f1efea; --n1:#e9f1fb; --n2:#eef7f2; --n3:#fbf0e9; --n4:#f5f1e3;
  --display:"Noto Serif SC","Songti SC",serif; --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
 font-family:'Noto Sans SC','PingFang SC',sans-serif; background:var(--panel)}
svg.chart{display:block;width:100%;height:auto;min-width:560px}
svg .s1{fill:var(--s1)} svg .s2{fill:var(--s2)} svg .s3{fill:var(--s3)} svg .s4{fill:var(--s4)} svg .muted{fill:var(--mute-fill)}
svg .seg-ok{fill:var(--s1)} svg .seg-bad{fill:var(--s2)} svg .seg-miss{fill:var(--mute-fill)}
svg .line{fill:none;stroke-width:2} svg .line.s1{stroke:var(--s1)} svg .line.s2{stroke:var(--s2)} svg .line.s4{stroke:var(--s4)}
svg .dot{stroke:var(--panel);stroke-width:2}
svg .grid{stroke:var(--grid);stroke-width:1} svg .axis{stroke:var(--faint);stroke-width:1} svg .rowrule{stroke:var(--grid);stroke-dasharray:2 4}
svg text{fill:var(--muted);font-family:var(--body);font-size:12.5px}
svg .tick{font-family:var(--mono);font-size:11px;fill:var(--faint)}
svg .val{font-family:var(--mono);font-size:12px;fill:var(--fg)}
svg .lab{fill:var(--fg);font-size:13px} svg .axlab{font-size:12px;fill:var(--muted)}
svg .hitbox{fill:transparent} svg .hair{stroke:var(--faint);stroke-width:1;opacity:0}
svg .col:hover .hair,svg .col:focus .hair{opacity:1}
svg .hit:hover path,svg .hit:hover > rect:not(.hitbox){opacity:.85}
svg .node{fill:var(--n0);stroke:var(--rule)} svg .node.n1{fill:var(--n1)} svg .node.n2{fill:var(--n2)} svg .node.n3{fill:var(--n3)} svg .node.n4{fill:var(--n4)}
svg .nodet{fill:var(--fg);font-weight:600;font-size:14px} svg .nodes{fill:var(--muted);font-size:12px}
svg .meas{fill:var(--fg);font-family:var(--mono);font-size:12.5px}
svg .flow{stroke:var(--faint);stroke-width:1.5} svg .arrowhead{fill:var(--faint)}
svg .life{stroke:var(--rule);stroke-dasharray:3 4}
svg .msg{fill:none;stroke-width:1.8} svg .msg.m1{stroke:var(--s1)} svg .msg.m2{stroke:var(--s2)} svg .msg.m3{stroke:var(--s3)}
svg .msgt{fill:var(--fg);font-size:12.5px;font-weight:600} svg .msgs{fill:var(--muted);font-size:11.5px}
svg .hair{display:none}</style><line class="grid" x1="210.0" x2="210.0" y1="18" y2="206"/><text class="tick" x="210.0" y="12" text-anchor="middle">0</text><line class="grid" x1="342.1" x2="342.1" y1="18" y2="206"/><text class="tick" x="342.1" y="12" text-anchor="middle">2,000</text><line class="grid" x1="474.1" x2="474.1" y1="18" y2="206"/><text class="tick" x="474.1" y="12" text-anchor="middle">4,000</text><line class="grid" x1="606.2" x2="606.2" y1="18" y2="206"/><text class="tick" x="606.2" y="12" text-anchor="middle">6,000</text><g class="hit" data-tip="所有 Qwen 作业中，生成思考 token 的时间（按 token 占比分摊）"><rect class="hitbox" x="0" y="23" width="720" height="30"/><text class="lab" x="200" y="41.0" text-anchor="end" dominant-baseline="middle">Qwen 解码思考 token</text><path class="s2" d="M210,30 h388.9 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-388.9 z"/><text class="val" x="608.9" y="41.0" dominant-baseline="middle">99.2 分钟</text></g><g class="hit" data-tip="生成正式输出的时间"><rect class="hitbox" x="0" y="53" width="720" height="30"/><text class="lab" x="200" y="71.0" text-anchor="end" dominant-baseline="middle">Qwen 解码代码和工具调用</text><path class="s2" d="M210,60 h94.9 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-94.9 z"/><text class="val" x="314.9" y="71.0" dominant-baseline="middle">25.0 分钟</text></g><g class="hit" data-tip="两步之间：解析、发下一个请求、预填充新增内容"><rect class="hitbox" x="0" y="83" width="720" height="30"/><text class="lab" x="200" y="101.0" text-anchor="end" dominant-baseline="middle">步间间隔（OpenCode、预填充）</text><path class="s4" d="M210,90 h13.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-13.0 z"/><text class="val" x="233.0" y="101.0" dominant-baseline="middle">4.3 分钟</text></g><g class="hit" data-tip="两种协作方式所有审查阶段的时间"><rect class="hitbox" x="0" y="113" width="720" height="30"/><text class="lab" x="200" y="131.0" text-anchor="end" dominant-baseline="middle">Claude 审查</text><path class="s1" d="M210,120 h60.5 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-60.5 z"/><text class="val" x="280.5" y="131.0" dominant-baseline="middle">16.3 分钟</text></g><g class="hit" data-tip="6 次规划"><rect class="hitbox" x="0" y="143" width="720" height="30"/><text class="lab" x="200" y="161.0" text-anchor="end" dominant-baseline="middle">Codex 规划</text><path class="s3" d="M210,150 h18.7 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-18.7 z"/><text class="val" x="238.7" y="161.0" dominant-baseline="middle">5.7 分钟</text></g><g class="hit" data-tip="OpenCode 记录的工具运行时间"><rect class="hitbox" x="0" y="173" width="720" height="30"/><text class="lab" x="200" y="191.0" text-anchor="end" dominant-baseline="middle">工具执行（读写文件、pytest、git）</text><path class="s4" d="M210,180 h0.2 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-0.2 z"/><text class="val" x="220.2" y="191.0" dominant-baseline="middle">63 秒</text></g><line class="axis" x1="210" x2="210" y1="18" y2="206"/></svg>