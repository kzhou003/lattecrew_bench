<svg xmlns="http://www.w3.org/2000/svg" width="720" height="176" class="chart" viewBox="0 0 720 176" role="img" aria-label="MTP decode speed" preserveAspectRatio="xMidYMid meet"><style>svg{
  /* Layout: one reading column of about 68ch; figures may widen to 920px. Lab-notebook calm, coffee-tinted neutrals. */
  --bg:#f7f6f3; --panel:#ffffff; --fg:#1d1c1a; --muted:#5d5b55; --faint:#8b8880; --rule:#e2dfd8; --grid:#ebe8e2;
  --accent:#7a4a2a; --code-bg:#efece6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --mute-fill:#c9c6bf;
  --n0:#f1efea; --n1:#e9f1fb; --n2:#eef7f2; --n3:#fbf0e9; --n4:#f5f1e3;
  --display:"Noto Serif SC","Songti SC",serif; --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
 font-family:'Noto Sans SC','PingFang SC',sans-serif; background:var(--panel)}
svg.chart{display:block;width:100%;height:auto;min-width:560px}
svg .s1{fill:var(--s1)} svg .s2{fill:var(--s2)} svg .s3{fill:var(--s3)} svg .s4{fill:var(--s4)} svg .muted{fill:var(--mute-fill)}
svg .seg-ok{fill:var(--s1)} svg .seg-bad{fill:var(--s2)} svg .seg-miss{fill:var(--mute-fill)}
svg .line{fill:none;stroke-width:2} svg .line.s1{stroke:var(--s1)} svg .line.s2{stroke:var(--s2)} svg .line.s4{stroke:var(--s4)}
svg .dot{stroke:var(--panel);stroke-width:2}
svg .grid{stroke:var(--grid);stroke-width:1} svg .axis{stroke:var(--faint);stroke-width:1} svg .rowrule{stroke:var(--grid);stroke-dasharray:2 4}
svg text{fill:var(--muted);font-family:var(--body);font-size:12.5px}
svg .tick{font-family:var(--mono);font-size:11px;fill:var(--faint)}
svg .val{font-family:var(--mono);font-size:12px;fill:var(--fg)}
svg .lab{fill:var(--fg);font-size:13px} svg .axlab{font-size:12px;fill:var(--muted)}
svg .hitbox{fill:transparent} svg .hair{stroke:var(--faint);stroke-width:1;opacity:0}
svg .col:hover .hair,svg .col:focus .hair{opacity:1}
svg .hit:hover path,svg .hit:hover > rect:not(.hitbox){opacity:.85}
svg .node{fill:var(--n0);stroke:var(--rule)} svg .node.n1{fill:var(--n1)} svg .node.n2{fill:var(--n2)} svg .node.n3{fill:var(--n3)} svg .node.n4{fill:var(--n4)}
svg .nodet{fill:var(--fg);font-weight:600;font-size:14px} svg .nodes{fill:var(--muted);font-size:12px}
svg .meas{fill:var(--fg);font-family:var(--mono);font-size:12.5px}
svg .flow{stroke:var(--faint);stroke-width:1.5} svg .arrowhead{fill:var(--faint)}
svg .life{stroke:var(--rule);stroke-dasharray:3 4}
svg .msg{fill:none;stroke-width:1.8} svg .msg.m1{stroke:var(--s1)} svg .msg.m2{stroke:var(--s2)} svg .msg.m3{stroke:var(--s3)}
svg .msgt{fill:var(--fg);font-size:12.5px;font-weight:600} svg .msgs{fill:var(--muted);font-size:11.5px}
svg .hair{display:none}</style><line class="grid" x1="150.0" x2="150.0" y1="22" y2="170"/><text class="tick" x="150.0" y="14" text-anchor="middle">0</text><line class="grid" x1="267.8" x2="267.8" y1="22" y2="170"/><text class="tick" x="267.8" y="14" text-anchor="middle">40</text><line class="grid" x1="385.6" x2="385.6" y1="22" y2="170"/><text class="tick" x="385.6" y="14" text-anchor="middle">80</text><line class="grid" x1="503.3" x2="503.3" y1="22" y2="170"/><text class="tick" x="503.3" y="14" text-anchor="middle">120</text><line class="grid" x1="621.1" x2="621.1" y1="22" y2="170"/><text class="tick" x="621.1" y="14" text-anchor="middle">160</text><text class="lab" x="138" y="47.0" text-anchor="end" dominant-baseline="middle">不用推测解码</text><line class="rowrule" x1="150" x2="680" y1="47.0" y2="47.0"/><g class="hit" data-tip="编程回答（开思考） · 不用推测解码: 77.1 tok/s"><circle class="hitbox" cx="377.0" cy="43.5" r="11"/><circle class="dot s2" cx="377.0" cy="43.5" r="6"/></g><g class="hit" data-tip="编程回答（不开思考） · 不用推测解码: 77.1 tok/s"><circle class="hitbox" cx="377.0" cy="50.5" r="11"/><circle class="dot s1" cx="377.0" cy="50.5" r="6"/></g><text class="lab" x="138" y="81.0" text-anchor="end" dominant-baseline="middle">MTP 猜 1 个</text><line class="rowrule" x1="150" x2="680" y1="81.0" y2="81.0"/><g class="hit" data-tip="编程回答（开思考） · MTP 猜 1 个: 103.3 tok/s，接受率 76%"><circle class="hitbox" cx="454.2" cy="77.5" r="11"/><circle class="dot s2" cx="454.2" cy="77.5" r="6"/></g><g class="hit" data-tip="编程回答（不开思考） · MTP 猜 1 个: 115.6 tok/s，接受率 96%"><circle class="hitbox" cx="490.4" cy="84.5" r="11"/><circle class="dot s1" cx="490.4" cy="84.5" r="6"/></g><text class="lab" x="138" y="115.0" text-anchor="end" dominant-baseline="middle">MTP 猜 2 个</text><line class="rowrule" x1="150" x2="680" y1="115.0" y2="115.0"/><g class="hit" data-tip="编程回答（开思考） · MTP 猜 2 个: 109.6 tok/s，接受率 57%"><circle class="hitbox" cx="472.7" cy="111.5" r="11"/><circle class="dot s2" cx="472.7" cy="111.5" r="6"/></g><g class="hit" data-tip="编程回答（不开思考） · MTP 猜 2 个: 146.7 tok/s，接受率 92%"><circle class="hitbox" cx="582.0" cy="118.5" r="11"/><circle class="dot s1" cx="582.0" cy="118.5" r="6"/></g><text class="lab" x="138" y="149.0" text-anchor="end" dominant-baseline="middle">MTP 猜 3 个</text><line class="rowrule" x1="150" x2="680" y1="149.0" y2="149.0"/><g class="hit" data-tip="编程回答（开思考） · MTP 猜 3 个: 117.0 tok/s，接受率 52%"><circle class="hitbox" cx="494.5" cy="145.5" r="11"/><circle class="dot s2" cx="494.5" cy="145.5" r="6"/></g><g class="hit" data-tip="编程回答（不开思考） · MTP 猜 3 个: 155.4 tok/s，接受率 80%"><circle class="hitbox" cx="607.7" cy="152.5" r="11"/><circle class="dot s1" cx="607.7" cy="152.5" r="6"/></g></svg>