<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" class="chart" viewBox="0 0 760 600" role="img" aria-label="LatteCrew request path with measured latency per layer" preserveAspectRatio="xMidYMid meet"><style>svg{
  /* Layout: one reading column of about 68ch; figures may widen to 920px. Lab-notebook calm, coffee-tinted neutrals. */
  --bg:#f7f6f3; --panel:#ffffff; --fg:#1d1c1a; --muted:#5d5b55; --faint:#8b8880; --rule:#e2dfd8; --grid:#ebe8e2;
  --accent:#7a4a2a; --code-bg:#efece6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --mute-fill:#c9c6bf;
  --n0:#f1efea; --n1:#e9f1fb; --n2:#eef7f2; --n3:#fbf0e9; --n4:#f5f1e3;
  --display:"Noto Serif SC","Songti SC",serif; --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
 font-family:'Noto Sans SC','PingFang SC',sans-serif; background:var(--panel)}
svg.chart{display:block;width:100%;height:auto;min-width:560px}
svg .s1{fill:var(--s1)} svg .s2{fill:var(--s2)} svg .s3{fill:var(--s3)} svg .s4{fill:var(--s4)} svg .muted{fill:var(--mute-fill)}
svg .seg-ok{fill:var(--s1)} svg .seg-bad{fill:var(--s2)} svg .seg-miss{fill:var(--mute-fill)}
svg .line{fill:none;stroke-width:2} svg .line.s1{stroke:var(--s1)} svg .line.s2{stroke:var(--s2)} svg .line.s4{stroke:var(--s4)}
svg .dot{stroke:var(--panel);stroke-width:2}
svg .grid{stroke:var(--grid);stroke-width:1} svg .axis{stroke:var(--faint);stroke-width:1} svg .rowrule{stroke:var(--grid);stroke-dasharray:2 4}
svg text{fill:var(--muted);font-family:var(--body);font-size:12.5px}
svg .tick{font-family:var(--mono);font-size:11px;fill:var(--faint)}
svg .val{font-family:var(--mono);font-size:12px;fill:var(--fg)}
svg .lab{fill:var(--fg);font-size:13px} svg .axlab{font-size:12px;fill:var(--muted)}
svg .hitbox{fill:transparent} svg .hair{stroke:var(--faint);stroke-width:1;opacity:0}
svg .col:hover .hair,svg .col:focus .hair{opacity:1}
svg .hit:hover path,svg .hit:hover > rect:not(.hitbox){opacity:.85}
svg .node{fill:var(--n0);stroke:var(--rule)} svg .node.n1{fill:var(--n1)} svg .node.n2{fill:var(--n2)} svg .node.n3{fill:var(--n3)} svg .node.n4{fill:var(--n4)}
svg .nodet{fill:var(--fg);font-weight:600;font-size:14px} svg .nodes{fill:var(--muted);font-size:12px}
svg .meas{fill:var(--fg);font-family:var(--mono);font-size:12.5px}
svg .flow{stroke:var(--faint);stroke-width:1.5} svg .arrowhead{fill:var(--faint)}
svg .life{stroke:var(--rule);stroke-dasharray:3 4}
svg .msg{fill:none;stroke-width:1.8} svg .msg.m1{stroke:var(--s1)} svg .msg.m2{stroke:var(--s2)} svg .msg.m3{stroke:var(--s3)}
svg .msgt{fill:var(--fg);font-size:12.5px;font-weight:600} svg .msgs{fill:var(--muted);font-size:11.5px}
svg .hair{display:none}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,0 L5,10 z" class="arrowhead"/></marker></defs><g class="hit" data-tip="你 · Tailscale RTT 约 8–22 ms"><rect class="node n0" x="4" y="8" width="350" height="58" rx="8"/><text class="nodet" x="20" y="32">你</text><text class="nodes" x="20" y="52">手机 Slack / Mac 终端</text><text class="meas" x="378" y="32">Tailscale RTT 约 8–22 ms</text></g><line class="flow" x1="175" y1="68" x2="175" y2="79" marker-end="url(#arr)"/><g class="hit" data-tip="Kiro Crew 网关 · qwen 网关一轮 20.7 秒，修复后 10.8 秒 / Mac 上 Claude 网关一轮 4.6–7.0 秒"><rect class="node n1" x="4" y="82" width="350" height="58" rx="8"/><text class="nodet" x="20" y="106">Kiro Crew 网关</text><text class="nodes" x="20" y="126">Mac: claude、codex；latte: claude、qwen</text><text class="meas" x="378" y="106">qwen 网关一轮 20.7 秒，修复后 10.8 秒</text><text class="meas" x="378" y="126">Mac 上 Claude 网关一轮 4.6–7.0 秒</text></g><line class="flow" x1="175" y1="142" x2="175" y2="153" marker-end="url(#arr)"/><g class="hit" data-tip="Agent harness · Claude Code 空任务 3.6 秒，API 只占 0.65 秒 / OpenCode 空任务 2.1 秒，提示 12,198 token"><rect class="node n1" x="4" y="156" width="350" height="58" rx="8"/><text class="nodet" x="20" y="180">Agent harness</text><text class="nodes" x="20" y="200">Claude Code 0.101 / OpenCode 1.19 / Codex CLI</text><text class="meas" x="378" y="180">Claude Code 空任务 3.6 秒，API 只占 0.65 秒</text><text class="meas" x="378" y="200">OpenCode 空任务 2.1 秒，提示 12,198 token</text></g><line class="flow" x1="175" y1="216" x2="175" y2="227" marker-end="url(#arr)"/><g class="hit" data-tip="MCP over SSH · 新会话调用 459 ms，常驻会话 9.9 ms / SSH 新连接 357 ms，复用 38 ms"><rect class="node n2" x="4" y="230" width="350" height="58" rx="8"/><text class="nodet" x="20" y="254">MCP over SSH</text><text class="nodes" x="20" y="274">latte-crew MCP，Tailscale 上的 SSH</text><text class="meas" x="378" y="254">新会话调用 459 ms，常驻会话 9.9 ms</text><text class="meas" x="378" y="274">SSH 新连接 357 ms，复用 38 ms</text></g><line class="flow" x1="175" y1="290" x2="175" y2="301" marker-end="url(#arr)"/><g class="hit" data-tip="crewd · 工具执行占 Qwen 作业 0.8% / 步间间隔占 3.3%"><rect class="node n2" x="4" y="304" width="350" height="58" rx="8"/><text class="nodet" x="20" y="328">crewd</text><text class="nodes" x="20" y="348">作业队列、git worktree、GPU 锁、账本</text><text class="meas" x="378" y="328">工具执行占 Qwen 作业 0.8%</text><text class="meas" x="378" y="348">步间间隔占 3.3%</text></g><line class="flow" x1="175" y1="364" x2="175" y2="375" marker-end="url(#arr)"/><g class="hit" data-tip="llama-swap :8100 · 代理开销 +1.4 ms，SSH 隧道 +29 ms / 切换模型 35–66 秒"><rect class="node n3" x="4" y="378" width="350" height="58" rx="8"/><text class="nodet" x="20" y="402">llama-swap :8100</text><text class="nodes" x="20" y="422">按需加载、互斥切换模型</text><text class="meas" x="378" y="402">代理开销 +1.4 ms，SSH 隧道 +29 ms</text><text class="meas" x="378" y="422">切换模型 35–66 秒</text></g><line class="flow" x1="175" y1="438" x2="175" y2="449" marker-end="url(#arr)"/><g class="hit" data-tip="vLLM 0.32 / vLLM-Omni 0.32 · 冷预填充约 3,549 tok/s，命中缓存 0.2–0.3 秒 / 解码 12.8–15.4 ms/token"><rect class="node n3" x="4" y="452" width="350" height="58" rx="8"/><text class="nodet" x="20" y="476">vLLM 0.32 / vLLM-Omni 0.32</text><text class="nodes" x="20" y="496">Qwen3.8-27B AWQ；Z-Image、Qwen3-TTS、Wan2.2</text><text class="meas" x="378" y="476">冷预填充约 3,549 tok/s，命中缓存 0.2–0.3 秒</text><text class="meas" x="378" y="496">解码 12.8–15.4 ms/token</text></g><line class="flow" x1="175" y1="512" x2="175" y2="523" marker-end="url(#arr)"/><g class="hit" data-tip="RTX 5090 32 GB · Wan 去噪全程顶在 575 W，SM 约 2.5 GHz / LLM 基准中位功耗 485 W，2.8 GHz"><rect class="node n4" x="4" y="526" width="350" height="58" rx="8"/><text class="nodet" x="20" y="550">RTX 5090 32 GB</text><text class="nodes" x="20" y="570">575 W 功耗上限，PCIe 5.0 x16</text><text class="meas" x="378" y="550">Wan 去噪全程顶在 575 W，SM 约 2.5 GHz</text><text class="meas" x="378" y="570">LLM 基准中位功耗 485 W，2.8 GHz</text></g></svg>