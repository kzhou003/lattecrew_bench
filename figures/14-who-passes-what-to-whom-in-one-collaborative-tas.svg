<svg xmlns="http://www.w3.org/2000/svg" width="760" height="636" class="chart" viewBox="0 0 760 636" role="img" aria-label="Who passes what to whom in one collaborative task" preserveAspectRatio="xMidYMid meet"><style>svg{
  /* Layout: one reading column of about 68ch; figures may widen to 920px. Lab-notebook calm, coffee-tinted neutrals. */
  --bg:#f7f6f3; --panel:#ffffff; --fg:#1d1c1a; --muted:#5d5b55; --faint:#8b8880; --rule:#e2dfd8; --grid:#ebe8e2;
  --accent:#7a4a2a; --code-bg:#efece6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --mute-fill:#c9c6bf;
  --n0:#f1efea; --n1:#e9f1fb; --n2:#eef7f2; --n3:#fbf0e9; --n4:#f5f1e3;
  --display:"Noto Serif SC","Songti SC",serif; --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
 font-family:'Noto Sans SC','PingFang SC',sans-serif; background:var(--panel)}
svg.chart{display:block;width:100%;height:auto;min-width:560px}
svg .s1{fill:var(--s1)} svg .s2{fill:var(--s2)} svg .s3{fill:var(--s3)} svg .s4{fill:var(--s4)} svg .muted{fill:var(--mute-fill)}
svg .seg-ok{fill:var(--s1)} svg .seg-bad{fill:var(--s2)} svg .seg-miss{fill:var(--mute-fill)}
svg .line{fill:none;stroke-width:2} svg .line.s1{stroke:var(--s1)} svg .line.s2{stroke:var(--s2)} svg .line.s4{stroke:var(--s4)}
svg .dot{stroke:var(--panel);stroke-width:2}
svg .grid{stroke:var(--grid);stroke-width:1} svg .axis{stroke:var(--faint);stroke-width:1} svg .rowrule{stroke:var(--grid);stroke-dasharray:2 4}
svg text{fill:var(--muted);font-family:var(--body);font-size:12.5px}
svg .tick{font-family:var(--mono);font-size:11px;fill:var(--faint)}
svg .val{font-family:var(--mono);font-size:12px;fill:var(--fg)}
svg .lab{fill:var(--fg);font-size:13px} svg .axlab{font-size:12px;fill:var(--muted)}
svg .hitbox{fill:transparent} svg .hair{stroke:var(--faint);stroke-width:1;opacity:0}
svg .col:hover .hair,svg .col:focus .hair{opacity:1}
svg .hit:hover path,svg .hit:hover > rect:not(.hitbox){opacity:.85}
svg .node{fill:var(--n0);stroke:var(--rule)} svg .node.n1{fill:var(--n1)} svg .node.n2{fill:var(--n2)} svg .node.n3{fill:var(--n3)} svg .node.n4{fill:var(--n4)}
svg .nodet{fill:var(--fg);font-weight:600;font-size:14px} svg .nodes{fill:var(--muted);font-size:12px}
svg .meas{fill:var(--fg);font-family:var(--mono);font-size:12.5px}
svg .flow{stroke:var(--faint);stroke-width:1.5} svg .arrowhead{fill:var(--faint)}
svg .life{stroke:var(--rule);stroke-dasharray:3 4}
svg .msg{fill:none;stroke-width:1.8} svg .msg.m1{stroke:var(--s1)} svg .msg.m2{stroke:var(--s2)} svg .msg.m3{stroke:var(--s3)}
svg .msgt{fill:var(--fg);font-size:12.5px;font-weight:600} svg .msgs{fill:var(--muted);font-size:11.5px}
svg .hair{display:none}</style><defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><rect class="node" x="8" y="4" width="124" height="44" rx="8"/><text class="nodet" x="70" y="23" text-anchor="middle">驱动脚本</text><text class="nodes" x="70" y="40" text-anchor="middle">Mac</text><line class="life" x1="70" x2="70" y1="50" y2="630"/><rect class="node" x="163" y="4" width="124" height="44" rx="8"/><text class="nodet" x="225" y="23" text-anchor="middle">Codex</text><text class="nodes" x="225" y="40" text-anchor="middle">Mac，只读</text><line class="life" x1="225" x2="225" y1="50" y2="630"/><rect class="node" x="318" y="4" width="124" height="44" rx="8"/><text class="nodet" x="380" y="23" text-anchor="middle">crewd</text><text class="nodes" x="380" y="40" text-anchor="middle">latte</text><line class="life" x1="380" x2="380" y1="50" y2="630"/><rect class="node" x="473" y="4" width="124" height="44" rx="8"/><text class="nodet" x="535" y="23" text-anchor="middle">Qwen · OpenCode</text><text class="nodes" x="535" y="40" text-anchor="middle">latte GPU</text><line class="life" x1="535" x2="535" y1="50" y2="630"/><rect class="node" x="628" y="4" width="124" height="44" rx="8"/><text class="nodet" x="690" y="23" text-anchor="middle">Claude 审查</text><text class="nodes" x="690" y="40" text-anchor="middle">latte，只读</text><line class="life" x1="690" x2="690" y1="50" y2="630"/><g class="hit" data-tip="任务描述 · 613–1,170 字符"><line class="msg m1" x1="74" x2="219" y1="88" y2="88" marker-end="url(#arr2)"/><text class="msgt" x="148" y="82" text-anchor="middle">任务描述</text><text class="msgs" x="148" y="104" text-anchor="middle">613–1,170 字符</text></g><g class="hit" data-tip="读仓库，写计划 · 约 44 秒，读入 3.9–6.1 万 token"><path class="msg m3" d="M225,126 h34 v16 h-30" marker-end="url(#arr2)"/><text class="msgt" x="267" y="130">读仓库，写计划</text><text class="msgs" x="267" y="146">约 44 秒，读入 3.9–6.1 万 token</text></g><g class="hit" data-tip="实现计划 · 2.0–4.6K 字符，含数据结构、步骤、陷阱、测试"><line class="msg m3" x1="221" x2="76" y1="180" y2="180" marker-end="url(#arr2)"/><text class="msgt" x="148" y="174" text-anchor="middle">实现计划</text><text class="msgs" x="148" y="196" text-anchor="middle">2.0–4.6K 字符，含数据结构、步骤、陷阱、测试</text></g><g class="hit" data-tip="crew local（任务 + 计划） · 经 SSH 调用 crewd"><line class="msg m1" x1="74" x2="374" y1="226" y2="226" marker-end="url(#arr2)"/><text class="msgt" x="225" y="220" text-anchor="middle">crew local（任务 + 计划）</text><text class="msgs" x="225" y="242" text-anchor="middle">经 SSH 调用 crewd</text></g><g class="hit" data-tip="角色提示 + 工作目录 + 任务 · 新 git worktree，OpenCode 只能写这里"><line class="msg m2" x1="384" x2="529" y1="272" y2="272" marker-end="url(#arr2)"/><text class="msgt" x="458" y="266" text-anchor="middle">角色提示 + 工作目录 + 任务</text><text class="msgs" x="458" y="288" text-anchor="middle">新 git worktree，OpenCode 只能写这里</text></g><g class="hit" data-tip="读、写、跑 pytest 的循环 · 每轮 8–30 步，思考占生成的 80%"><path class="msg m2" d="M535,310 h34 v16 h-30" marker-end="url(#arr2)"/><text class="msgt" x="577" y="314">读、写、跑 pytest 的循环</text><text class="msgs" x="577" y="330">每轮 8–30 步，思考占生成的 80%</text></g><g class="hit" data-tip="提交 + 自述 · 自述 170–1,270 字符，审查者看不到"><line class="msg m2" x1="531" x2="386" y1="364" y2="364" marker-end="url(#arr2)"/><text class="msgt" x="458" y="358" text-anchor="middle">提交 + 自述</text><text class="msgs" x="458" y="380" text-anchor="middle">自述 170–1,270 字符，审查者看不到</text></g><g class="hit" data-tip="任务 + git diff base...HEAD · 只读，不给作者的自述"><line class="msg m1" x1="384" x2="684" y1="410" y2="410" marker-end="url(#arr2)"/><text class="msgt" x="535" y="404" text-anchor="middle">任务 + git diff base...HEAD</text><text class="msgs" x="535" y="426" text-anchor="middle">只读，不给作者的自述</text></g><g class="hit" data-tip="读 diff，自己跑测试、复现问题 · 9–40 秒；一次压力测试跑了 12 分钟"><path class="msg m1" d="M690,448 h-34 v16 h30" marker-end="url(#arr2)"/><text class="msgt" x="648" y="452" text-anchor="end">读 diff，自己跑测试、复现问题</text><text class="msgs" x="648" y="468" text-anchor="end">9–40 秒；一次压力测试跑了 12 分钟</text></g><g class="hit" data-tip="审查意见 + VERDICT · 630–2,030 字符，带 file:line 和失败场景"><line class="msg m1" x1="686" x2="386" y1="502" y2="502" marker-end="url(#arr2)"/><text class="msgt" x="535" y="496" text-anchor="middle">审查意见 + VERDICT</text><text class="msgs" x="535" y="518" text-anchor="middle">630–2,030 字符，带 file:line 和失败场景</text></g><g class="hit" data-tip="CHANGES：意见发回同一会话 · 最多 2 轮，之后转人工"><line class="msg m2" x1="384" x2="529" y1="548" y2="548" marker-end="url(#arr2)"/><text class="msgt" x="458" y="542" text-anchor="middle">CHANGES：意见发回同一会话</text><text class="msgs" x="458" y="564" text-anchor="middle">最多 2 轮，之后转人工</text></g><g class="hit" data-tip="PASS：ready，分支等人合并 · agent 不 push、不 merge"><line class="msg m1" x1="376" x2="76" y1="594" y2="594" marker-end="url(#arr2)"/><text class="msgt" x="225" y="588" text-anchor="middle">PASS：ready，分支等人合并</text><text class="msgs" x="225" y="610" text-anchor="middle">agent 不 push、不 merge</text></g></svg>