<svg xmlns="http://www.w3.org/2000/svg" width="720" height="274" class="chart" viewBox="0 0 720 274" role="img" aria-label="GPU kernel time prefill" preserveAspectRatio="xMidYMid meet"><style>svg{
  /* Layout: one reading column of about 68ch; figures may widen to 920px. Lab-notebook calm, coffee-tinted neutrals. */
  --bg:#f7f6f3; --panel:#ffffff; --fg:#1d1c1a; --muted:#5d5b55; --faint:#8b8880; --rule:#e2dfd8; --grid:#ebe8e2;
  --accent:#7a4a2a; --code-bg:#efece6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --mute-fill:#c9c6bf;
  --n0:#f1efea; --n1:#e9f1fb; --n2:#eef7f2; --n3:#fbf0e9; --n4:#f5f1e3;
  --display:"Noto Serif SC","Songti SC",serif; --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
 font-family:'Noto Sans SC','PingFang SC',sans-serif; background:var(--panel)}
svg.chart{display:block;width:100%;height:auto;min-width:560px}
svg .s1{fill:var(--s1)} svg .s2{fill:var(--s2)} svg .s3{fill:var(--s3)} svg .s4{fill:var(--s4)} svg .muted{fill:var(--mute-fill)}
svg .seg-ok{fill:var(--s1)} svg .seg-bad{fill:var(--s2)} svg .seg-miss{fill:var(--mute-fill)}
svg .line{fill:none;stroke-width:2} svg .line.s1{stroke:var(--s1)} svg .line.s2{stroke:var(--s2)} svg .line.s4{stroke:var(--s4)}
svg .dot{stroke:var(--panel);stroke-width:2}
svg .grid{stroke:var(--grid);stroke-width:1} svg .axis{stroke:var(--faint);stroke-width:1} svg .rowrule{stroke:var(--grid);stroke-dasharray:2 4}
svg text{fill:var(--muted);font-family:var(--body);font-size:12.5px}
svg .tick{font-family:var(--mono);font-size:11px;fill:var(--faint)}
svg .val{font-family:var(--mono);font-size:12px;fill:var(--fg)}
svg .lab{fill:var(--fg);font-size:13px} svg .axlab{font-size:12px;fill:var(--muted)}
svg .hitbox{fill:transparent} svg .hair{stroke:var(--faint);stroke-width:1;opacity:0}
svg .col:hover .hair,svg .col:focus .hair{opacity:1}
svg .hit:hover path,svg .hit:hover > rect:not(.hitbox){opacity:.85}
svg .node{fill:var(--n0);stroke:var(--rule)} svg .node.n1{fill:var(--n1)} svg .node.n2{fill:var(--n2)} svg .node.n3{fill:var(--n3)} svg .node.n4{fill:var(--n4)}
svg .nodet{fill:var(--fg);font-weight:600;font-size:14px} svg .nodes{fill:var(--muted);font-size:12px}
svg .meas{fill:var(--fg);font-family:var(--mono);font-size:12.5px}
svg .flow{stroke:var(--faint);stroke-width:1.5} svg .arrowhead{fill:var(--faint)}
svg .life{stroke:var(--rule);stroke-dasharray:3 4}
svg .msg{fill:none;stroke-width:1.8} svg .msg.m1{stroke:var(--s1)} svg .msg.m2{stroke:var(--s2)} svg .msg.m3{stroke:var(--s3)}
svg .msgt{fill:var(--fg);font-size:12.5px;font-weight:600} svg .msgs{fill:var(--muted);font-size:11.5px}
svg .hair{display:none}</style><line class="grid" x1="230.0" x2="230.0" y1="18" y2="266"/><text class="tick" x="230.0" y="12" text-anchor="middle">0</text><line class="grid" x1="322.1" x2="322.1" y1="18" y2="266"/><text class="tick" x="322.1" y="12" text-anchor="middle">20</text><line class="grid" x1="414.3" x2="414.3" y1="18" y2="266"/><text class="tick" x="414.3" y="12" text-anchor="middle">40</text><line class="grid" x1="506.4" x2="506.4" y1="18" y2="266"/><text class="tick" x="506.4" y="12" text-anchor="middle">60</text><line class="grid" x1="598.5" x2="598.5" y1="18" y2="266"/><text class="tick" x="598.5" y="12" text-anchor="middle">80</text><g class="hit" data-tip="INT4 矩阵乘（Marlin）: 4,449.3 ms，81.4%"><rect class="hitbox" x="0" y="23" width="720" height="30"/><text class="lab" x="220" y="41.0" text-anchor="end" dominant-baseline="middle">INT4 矩阵乘（Marlin）</text><path class="s1" d="M230,30 h371.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-371.0 z"/><text class="val" x="611.0" y="41.0" dominant-baseline="middle">81.4%</text></g><g class="hit" data-tip="全注意力（FlashAttention）: 500.5 ms，9.2%"><rect class="hitbox" x="0" y="53" width="720" height="30"/><text class="lab" x="220" y="71.0" text-anchor="end" dominant-baseline="middle">全注意力（FlashAttention）</text><path class="s1" d="M230,60 h38.2 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-38.2 z"/><text class="val" x="278.2" y="71.0" dominant-baseline="middle">9.2%</text></g><g class="hit" data-tip="归一化与逐元素（Triton 融合）: 239.5 ms，4.4%"><rect class="hitbox" x="0" y="83" width="720" height="30"/><text class="lab" x="220" y="101.0" text-anchor="end" dominant-baseline="middle">归一化与逐元素（Triton 融合）</text><path class="s1" d="M230,90 h16.2 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-16.2 z"/><text class="val" x="256.2" y="101.0" dominant-baseline="middle">4.4%</text></g><g class="hit" data-tip="线性注意力（GDN、卷积）: 196.2 ms，3.6%"><rect class="hitbox" x="0" y="113" width="720" height="30"/><text class="lab" x="220" y="131.0" text-anchor="end" dominant-baseline="middle">线性注意力（GDN、卷积）</text><path class="s1" d="M230,120 h12.5 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-12.5 z"/><text class="val" x="252.5" y="131.0" dominant-baseline="middle">3.6%</text></g><g class="hit" data-tip="其他: 39.6 ms，0.7%"><rect class="hitbox" x="0" y="143" width="720" height="30"/><text class="lab" x="220" y="161.0" text-anchor="end" dominant-baseline="middle">其他</text><path class="s1" d="M230,150 h-0.7 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h--0.7 z"/><text class="val" x="239.3" y="161.0" dominant-baseline="middle">0.7%</text></g><g class="hit" data-tip="lm_head（bf16 GEMV）: 22.8 ms，0.4%"><rect class="hitbox" x="0" y="173" width="720" height="30"/><text class="lab" x="220" y="191.0" text-anchor="end" dominant-baseline="middle">lm_head（bf16 GEMV）</text><path class="s1" d="M230,180 h-2.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h--2.0 z"/><text class="val" x="238.0" y="191.0" dominant-baseline="middle">0.4%</text></g><g class="hit" data-tip="其他 bf16 矩阵乘: 15.7 ms，0.3%"><rect class="hitbox" x="0" y="203" width="720" height="30"/><text class="lab" x="220" y="221.0" text-anchor="end" dominant-baseline="middle">其他 bf16 矩阵乘</text><path class="s1" d="M230,210 h-2.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h--2.0 z"/><text class="val" x="238.0" y="221.0" dominant-baseline="middle">0.3%</text></g><g class="hit" data-tip="采样: 2.1 ms，0.0%"><rect class="hitbox" x="0" y="233" width="720" height="30"/><text class="lab" x="220" y="251.0" text-anchor="end" dominant-baseline="middle">采样</text><path class="s1" d="M230,240 h-2.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h--2.0 z"/><text class="val" x="238.0" y="251.0" dominant-baseline="middle">0.0%</text></g><line class="axis" x1="230" x2="230" y1="18" y2="266"/></svg>