<svg xmlns="http://www.w3.org/2000/svg" width="720" height="274" class="chart" viewBox="0 0 720 274" role="img" aria-label="Connection layer latency" preserveAspectRatio="xMidYMid meet"><style>svg{
  /* Layout: one reading column of about 68ch; figures may widen to 920px. Lab-notebook calm, coffee-tinted neutrals. */
  --bg:#f7f6f3; --panel:#ffffff; --fg:#1d1c1a; --muted:#5d5b55; --faint:#8b8880; --rule:#e2dfd8; --grid:#ebe8e2;
  --accent:#7a4a2a; --code-bg:#efece6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --mute-fill:#c9c6bf;
  --n0:#f1efea; --n1:#e9f1fb; --n2:#eef7f2; --n3:#fbf0e9; --n4:#f5f1e3;
  --display:"Noto Serif SC","Songti SC",serif; --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
 font-family:'Noto Sans SC','PingFang SC',sans-serif; background:var(--panel)}
svg.chart{display:block;width:100%;height:auto;min-width:560px}
svg .s1{fill:var(--s1)} svg .s2{fill:var(--s2)} svg .s3{fill:var(--s3)} svg .s4{fill:var(--s4)} svg .muted{fill:var(--mute-fill)}
svg .seg-ok{fill:var(--s1)} svg .seg-bad{fill:var(--s2)} svg .seg-miss{fill:var(--mute-fill)}
svg .line{fill:none;stroke-width:2} svg .line.s1{stroke:var(--s1)} svg .line.s2{stroke:var(--s2)} svg .line.s4{stroke:var(--s4)}
svg .dot{stroke:var(--panel);stroke-width:2}
svg .grid{stroke:var(--grid);stroke-width:1} svg .axis{stroke:var(--faint);stroke-width:1} svg .rowrule{stroke:var(--grid);stroke-dasharray:2 4}
svg text{fill:var(--muted);font-family:var(--body);font-size:12.5px}
svg .tick{font-family:var(--mono);font-size:11px;fill:var(--faint)}
svg .val{font-family:var(--mono);font-size:12px;fill:var(--fg)}
svg .lab{fill:var(--fg);font-size:13px} svg .axlab{font-size:12px;fill:var(--muted)}
svg .hitbox{fill:transparent} svg .hair{stroke:var(--faint);stroke-width:1;opacity:0}
svg .col:hover .hair,svg .col:focus .hair{opacity:1}
svg .hit:hover path,svg .hit:hover > rect:not(.hitbox){opacity:.85}
svg .node{fill:var(--n0);stroke:var(--rule)} svg .node.n1{fill:var(--n1)} svg .node.n2{fill:var(--n2)} svg .node.n3{fill:var(--n3)} svg .node.n4{fill:var(--n4)}
svg .nodet{fill:var(--fg);font-weight:600;font-size:14px} svg .nodes{fill:var(--muted);font-size:12px}
svg .meas{fill:var(--fg);font-family:var(--mono);font-size:12.5px}
svg .flow{stroke:var(--faint);stroke-width:1.5} svg .arrowhead{fill:var(--faint)}
svg .life{stroke:var(--rule);stroke-dasharray:3 4}
svg .msg{fill:none;stroke-width:1.8} svg .msg.m1{stroke:var(--s1)} svg .msg.m2{stroke:var(--s2)} svg .msg.m3{stroke:var(--s3)}
svg .msgt{fill:var(--fg);font-size:12.5px;font-weight:600} svg .msgs{fill:var(--muted);font-size:11.5px}
svg .hair{display:none}</style><line class="grid" x1="210.0" x2="210.0" y1="18" y2="266"/><text class="tick" x="210.0" y="12" text-anchor="middle">0</text><line class="grid" x1="381.1" x2="381.1" y1="18" y2="266"/><text class="tick" x="381.1" y="12" text-anchor="middle">200</text><line class="grid" x1="552.2" x2="552.2" y1="18" y2="266"/><text class="tick" x="552.2" y="12" text-anchor="middle">400</text><g class="hit" data-tip="SSH 新建连接: 356.5 ms · 每次新建 TCP + 密钥交换"><rect class="hitbox" x="0" y="23" width="720" height="30"/><text class="lab" x="200" y="41.0" text-anchor="end" dominant-baseline="middle">SSH 新建连接</text><path class="s4" d="M210,30 h301.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-301.0 z"/><text class="val" x="521.0" y="41.0" dominant-baseline="middle">357 ms</text></g><g class="hit" data-tip="SSH 复用连接: 37.9 ms · ControlMaster 复用"><rect class="hitbox" x="0" y="53" width="720" height="30"/><text class="lab" x="200" y="71.0" text-anchor="end" dominant-baseline="middle">SSH 复用连接</text><path class="s1" d="M210,60 h28.4 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-28.4 z"/><text class="val" x="248.4" y="71.0" dominant-baseline="middle">37.9 ms</text></g><g class="hit" data-tip="MCP 新会话调用: 459.2 ms · SSH + 启动 MCP 服务 + 初始化 + 一次调用"><rect class="hitbox" x="0" y="83" width="720" height="30"/><text class="lab" x="200" y="101.0" text-anchor="end" dominant-baseline="middle">MCP 新会话调用</text><path class="s4" d="M210,90 h388.9 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-388.9 z"/><text class="val" x="608.9" y="101.0" dominant-baseline="middle">459 ms</text></g><g class="hit" data-tip="MCP 复用 SSH: 138.9 ms · SSH 复用，但仍新起 MCP 进程"><rect class="hitbox" x="0" y="113" width="720" height="30"/><text class="lab" x="200" y="131.0" text-anchor="end" dominant-baseline="middle">MCP 复用 SSH</text><path class="s4" d="M210,120 h114.9 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-114.9 z"/><text class="val" x="334.9" y="131.0" dominant-baseline="middle">139 ms</text></g><g class="hit" data-tip="MCP 常驻会话: 9.9 ms · 会话已建立，只算一次工具调用"><rect class="hitbox" x="0" y="143" width="720" height="30"/><text class="lab" x="200" y="161.0" text-anchor="end" dominant-baseline="middle">MCP 常驻会话</text><path class="s1" d="M210,150 h4.5 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-4.5 z"/><text class="val" x="224.5" y="161.0" dominant-baseline="middle">9.9 ms</text></g><g class="hit" data-tip="scp 1 MB: 210.3 ms · 复用连接传 1 MB 文件"><rect class="hitbox" x="0" y="173" width="720" height="30"/><text class="lab" x="200" y="191.0" text-anchor="end" dominant-baseline="middle">scp 1 MB</text><path class="s1" d="M210,180 h175.9 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-175.9 z"/><text class="val" x="395.9" y="191.0" dominant-baseline="middle">210 ms</text></g><g class="hit" data-tip="SSH 隧道多出的 TTFT: 29.0 ms · 直连 139.4 ms，隧道 168.4 ms"><rect class="hitbox" x="0" y="203" width="720" height="30"/><text class="lab" x="200" y="221.0" text-anchor="end" dominant-baseline="middle">SSH 隧道多出的 TTFT</text><path class="s1" d="M210,210 h20.8 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-20.8 z"/><text class="val" x="240.8" y="221.0" dominant-baseline="middle">29.0 ms</text></g><g class="hit" data-tip="llama-swap 多出的 TTFT: 1.4 ms · 直连 139.4 ms，llama-swap 140.8 ms"><rect class="hitbox" x="0" y="233" width="720" height="30"/><text class="lab" x="200" y="251.0" text-anchor="end" dominant-baseline="middle">llama-swap 多出的 TTFT</text><path class="s1" d="M210,240 h-2.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h--2.0 z"/><text class="val" x="218.0" y="251.0" dominant-baseline="middle">1.4 ms</text></g><line class="axis" x1="210" x2="210" y1="18" y2="266"/></svg>